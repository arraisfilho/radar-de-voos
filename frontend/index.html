<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="color-scheme" content="light dark"/><meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" data-scheme="light"/><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" data-scheme="dark"/><script>try{var a=localStorage.getItem("radar-appearance");if(a==="light"||a==="dark"){document.documentElement.setAttribute("data-theme",a);document.querySelector('meta[name="color-scheme"]').setAttribute("content",a);var m=document.querySelectorAll("meta[data-scheme]");for(var i=0;m.length>i;i++)m[i].setAttribute("media",m[i].getAttribute("data-scheme")===a?"all":"not all")}}catch(e){}</script><meta name="description" content="Acompanhe voos e receba alertas de preço."/><title>Radar de Voos</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
